# Modified by the GOSRAN project from Coolify community templates.

name: GOSRAN Bug Report
description: Report a reproducible bug in the GOSRAN fork.
title: "fix: "
labels: ["🔍 Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a GOSRAN issue.

        Do not include secrets or security vulnerabilities here. Follow `SECURITY.md` for private reporting.
        If the bug also reproduces on an unmodified Coolify release, consider reporting it upstream at https://github.com/coollabsio/coolify/issues.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and which operator workflow did it interrupt?
      placeholder: Describe the problem and the visible error without secrets.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: gosran_revision
    attributes:
      label: GOSRAN revision
      description: Provide the commit SHA or branch. Do not paste credentials or env values.
      placeholder: "v4.x @ abc1234"
    validations:
      required: true

  - type: input
    id: upstream_revision
    attributes:
      label: Upstream Coolify revision
      description: If known, provide the corresponding upstream tag or commit.
      placeholder: "v4.x @ def5678"

  - type: dropdown
    id: upstream_reproduction
    attributes:
      label: Does it reproduce on unmodified Coolify?
      options:
        - "Not tested"
        - "No, GOSRAN-specific"
        - "Yes, also reproduces upstream"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - "Local development"
        - "Custom self-hosted build"
        - "Upstream Coolify instance"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15"

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach sanitized logs, screenshots, or recordings. Remove secrets and personal data.

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include workarounds, frequency, and impact if relevant.
